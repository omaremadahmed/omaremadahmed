<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#0c1425" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2744" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1a2744" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes scanline {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1000px); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.3; filter: none; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke: #1a2744; }
        50% { stroke: #2563eb; }
      }
      .scanner {
        animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .live-dot {
        animation: blinkDot 2s ease-in-out infinite;
      }
      .hud-frame {
        animation: borderPulse 6s ease-in-out infinite;
      }
      .mono-text {
        font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect x="2" y="2" width="896" height="116" rx="8" fill="url(#bgGrad)" stroke="#1a2744" stroke-width="1.5" class="hud-frame" />

  <!-- Scanning Light Line -->
  <g clip-path="url(#hudClip)">
    <clipPath id="hudClip">
      <rect x="2" y="2" width="896" height="116" rx="8" />
    </clipPath>
    <rect x="0" y="2" width="160" height="116" fill="url(#scanGrad)" class="scanner" />
  </g>

  <!-- Technical Corner Brackets -->
  <path d="M 6 18 L 6 6 L 18 6" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 894 18 L 894 6 L 882 6" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 6 102 L 6 114 L 18 114" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 894 102 L 894 114 L 882 114" fill="none" stroke="#3b82f6" stroke-width="2" />

  <!-- Grid Background Lines -->
  <line x1="24" y1="36" x2="876" y2="36" stroke="#142038" stroke-width="1" />
  <line x1="24" y1="84" x2="876" y2="84" stroke="#142038" stroke-width="1" />
  <line x1="220" y1="36" x2="220" y2="84" stroke="#142038" stroke-width="1" />
  <line x1="680" y1="36" x2="680" y2="84" stroke="#142038" stroke-width="1" />

  <!-- Left Telemetry Pod: Status & Discipline -->
  <g transform="translate(24, 18)">
    <circle cx="8" cy="42" r="5" fill="#10b981" class="live-dot" />
    <text x="22" y="46" fill="#10b981" font-size="11" font-weight="600" class="mono-text">SYSTEM STATUS: ONLINE</text>
    <text x="22" y="24" fill="#8b949e" font-size="9" font-weight="500" class="mono-text">[ NODE: HELWAN_BIS_02 ]</text>
    <text x="22" y="70" fill="#93c5fd" font-size="10" font-weight="500" class="mono-text">ROLE: SYSTEMS ARCHITECT</text>
  </g>

  <!-- Center Identity Pod -->
  <g transform="translate(240, 20)">
    <!-- Small Knight Icon Motif -->
    <path d="M 12 18 C 12 12 18 8 26 8 C 34 8 38 12 38 18 C 38 24 34 26 30 28 C 30 34 36 38 36 44 L 8 44 C 8 38 14 34 14 28 Z" fill="#3b82f6" opacity="0.3" transform="translate(0, 4) scale(0.7)" />
    <text x="35" y="32" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1" class="sans-text">OMAR EMAD AHMED</text>
    <text x="35" y="49" fill="#60a5fa" font-size="10.5" font-weight="600" letter-spacing="1.5" class="mono-text">ENGINEERING COMMAND CENTER // V3.2</text>
    <text x="35" y="66" fill="#8b949e" font-size="9.5" class="mono-text">CLEAN ARCHITECTURE · CQRS · RELATIONAL INTEGRITY · CLOUD</text>
  </g>

  <!-- Right Telemetry Pod: Performance Metrics -->
  <g transform="translate(700, 24)">
    <text x="0" y="16" fill="#8b949e" font-size="9.5" class="mono-text">THROUGHPUT: <tspan fill="#3b82f6" font-weight="600">&lt;20ms CACHED</tspan></text>
    <text x="0" y="36" fill="#8b949e" font-size="9.5" class="mono-text">DATA INTEGRITY: <tspan fill="#60a5fa" font-weight="600">21 SCHEMAS</tspan></text>
    <text x="0" y="56" fill="#8b949e" font-size="9.5" class="mono-text">PIPELINE: <tspan fill="#10b981" font-weight="600">VERIFIED PASSING</tspan></text>
  </g>

  <!-- Bottom Glowing Accent Line -->
  <line x1="120" y1="116" x2="780" y2="116" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glow)" />
</svg>
