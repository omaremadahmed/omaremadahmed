<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1425" />
      <stop offset="100%" stop-color="#111d35" />
    </linearGradient>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes activePulse {
        0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 3px #10b981); }
        50% { stroke: #34d399; filter: drop-shadow(0 0 10px #34d399); }
      }
      @keyframes transitionDash {
        to { stroke-dashoffset: -30; }
      }
      .active-state {
        animation: activePulse 2.5s ease-in-out infinite;
      }
      .transition-flow {
        stroke-dasharray: 5 3;
        animation: transitionDash 1.2s linear infinite;
      }
      .mono-text { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="880" height="260" rx="10" fill="#060b18" stroke="#1a2744" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 20)">
    <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="700" class="sans-text">STUDY PLANNER CS50W // POMODORO FINITE-STATE AUTOMATON</text>
    <text x="0" y="16" fill="#8b949e" font-size="9.5" class="mono-text">Client-side deterministic state lifecycle with asynchronous AJAX telemetry logging</text>
  </g>

  <!-- Node 1: IDLE -->
  <g transform="translate(50, 90)">
    <rect width="115" height="110" rx="8" fill="url(#nodeGrad)" stroke="#1a2744" stroke-width="1.5" />
    <circle cx="57" cy="35" r="14" fill="#081020" stroke="#3b82f6" stroke-width="1.5" />
    <text x="57" y="39" fill="#3b82f6" font-size="11" font-weight="700" text-anchor="middle" class="mono-text">01</text>
    <text x="57" y="68" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="sans-text">IDLE</text>
    <text x="57" y="85" fill="#8b949e" font-size="9" text-anchor="middle" class="mono-text">Ready State</text>
  </g>

  <!-- Transition 1 -> 2: StartTimer() -->
  <path d="M 165 145 L 225 145" fill="none" stroke="#3b82f6" stroke-width="2" class="transition-flow" />
  <polygon points="225,141 235,145 225,149" fill="#3b82f6" />
  <text x="200" y="135" fill="#60a5fa" font-size="8.5" text-anchor="middle" class="mono-text">Start()</text>

  <!-- Node 2: RUNNING (Active State with Glow) -->
  <g transform="translate(235, 80)">
    <rect width="135" height="130" rx="8" fill="#0c1425" stroke="#10b981" stroke-width="2" class="active-state" />
    <circle cx="67" cy="40" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="67" y="44" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle" class="mono-text">25m</text>
    <text x="67" y="76" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle" class="sans-text">RUNNING</text>
    <text x="67" y="94" fill="#e6edf3" font-size="9" text-anchor="middle" class="mono-text">Timer Countdown</text>
    <text x="67" y="108" fill="#8b949e" font-size="8.5" text-anchor="middle" class="mono-text">Active Session</text>
  </g>

  <!-- Bidirectional Arc: RUNNING <-> PAUSED -->
  <path d="M 370 125 C 400 100 420 100 450 125" fill="none" stroke="#f59e0b" stroke-width="1.5" class="transition-flow" />
  <polygon points="445,120 455,127 447,131" fill="#f59e0b" />
  <text x="410" y="98" fill="#fbbf24" font-size="8" text-anchor="middle" class="mono-text">Pause()</text>

  <path d="M 450 165 C 420 190 400 190 370 165" fill="none" stroke="#10b981" stroke-width="1.5" class="transition-flow" />
  <polygon points="375,170 365,163 373,159" fill="#10b981" />
  <text x="410" y="200" fill="#34d399" font-size="8" text-anchor="middle" class="mono-text">Resume()</text>

  <!-- Node 3: PAUSED -->
  <g transform="translate(450, 90)">
    <rect width="115" height="110" rx="8" fill="url(#nodeGrad)" stroke="#1a2744" stroke-width="1.5" />
    <circle cx="57" cy="35" r="14" fill="#081020" stroke="#f59e0b" stroke-width="1.5" />
    <text x="57" y="39" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle" class="mono-text">||</text>
    <text x="57" y="68" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="sans-text">PAUSED</text>
    <text x="57" y="85" fill="#8b949e" font-size="9" text-anchor="middle" class="mono-text">State Preserved</text>
  </g>

  <!-- Transition 2 -> 4: Complete Duration -->
  <path d="M 302 210 C 302 245 660 245 660 200" fill="none" stroke="#3b82f6" stroke-width="1.5" class="transition-flow" />
  <polygon points="656,205 660,195 664,205" fill="#3b82f6" />
  <text x="500" y="240" fill="#60a5fa" font-size="8.5" text-anchor="middle" class="mono-text">DurationElapsed()</text>

  <!-- Node 4: RESTING / BREAK -->
  <g transform="translate(605, 90)">
    <rect width="115" height="110" rx="8" fill="url(#nodeGrad)" stroke="#1a2744" stroke-width="1.5" />
    <circle cx="57" cy="35" r="14" fill="#081020" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="57" y="39" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" class="mono-text">5m</text>
    <text x="57" y="68" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="sans-text">BREAK</text>
    <text x="57" y="85" fill="#8b949e" font-size="9" text-anchor="middle" class="mono-text">Rest Cycle</text>
  </g>

  <!-- Transition 4 -> 5: Audit Log -->
  <path d="M 720 145 L 755 145" fill="none" stroke="#10b981" stroke-width="2" class="transition-flow" />
  <polygon points="755,141 765,145 755,149" fill="#10b981" />
  <text x="738" y="135" fill="#34d399" font-size="8.5" text-anchor="middle" class="mono-text">AJAX</text>

  <!-- Node 5: LOGGED LEDGER -->
  <g transform="translate(765, 90)">
    <rect width="90" height="110" rx="8" fill="#081020" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="35" fill="#10b981" font-size="18" text-anchor="middle">✓</text>
    <text x="45" y="65" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" class="sans-text">LOGGED</text>
    <text x="45" y="82" fill="#8b949e" font-size="8.5" text-anchor="middle" class="mono-text">Django ORM</text>
    <text x="45" y="96" fill="#8b949e" font-size="8" text-anchor="middle" class="mono-text">User Isolated</text>
  </g>
</svg>
