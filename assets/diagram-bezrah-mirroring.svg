<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1425" />
      <stop offset="100%" stop-color="#111d35" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <style>
      @keyframes mirrorFlow {
        0%, 100% { transform: scaleX(1); opacity: 0.8; }
        50% { transform: scaleX(1.15); opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      }
      @keyframes dashMirror {
        to { stroke-dashoffset: -24; }
      }
      .mirror-pulse {
        animation: mirrorFlow 3s ease-in-out infinite;
        transform-origin: center;
      }
      .mirror-line {
        stroke-dasharray: 4 4;
        animation: dashMirror 1.5s linear infinite;
      }
      .mono-text { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .arabic-text { font-family: 'Cairo', 'Tajawal', -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="880" height="280" rx="10" fill="#060b18" stroke="#1a2744" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="700" class="sans-text">BEZRAH (بذرة) PLATFORM // NATIVE BIDIRECTIONAL LAYOUT ENGINE</text>
    <text x="0" y="16" fill="#8b949e" font-size="9.5" class="mono-text">Zero-layout-shift mathematical mirroring via CSS Logical Properties &amp; Pinia state tree</text>
  </g>

  <!-- Left: LTR Viewport (English) -->
  <g transform="translate(30, 55)">
    <rect width="280" height="200" rx="6" fill="url(#vpGrad)" stroke="#1a2744" stroke-width="1" />
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#142038" />
    <circle cx="12" cy="13" r="3" fill="#ef4444" />
    <circle cx="22" cy="13" r="3" fill="#f59e0b" />
    <circle cx="32" cy="13" r="3" fill="#10b981" />
    <text x="45" y="16" fill="#e6edf3" font-size="9" class="mono-text">dir="ltr" [ English Viewport ]</text>

    <!-- Simulated UI Layout (Left-to-Right) -->
    <rect x="15" y="40" width="60" height="15" rx="3" fill="#2563eb" />
    <text x="45" y="51" fill="#ffffff" font-size="8" font-weight="600" text-anchor="middle" class="sans-text">Catalog</text>
    <rect x="85" y="40" width="40" height="15" rx="3" fill="#1e293b" />
    <rect x="135" y="40" width="40" height="15" rx="3" fill="#1e293b" />
    <rect x="235" y="40" width="30" height="15" rx="3" fill="#10b981" />

    <!-- Product Card (LTR) -->
    <rect x="15" y="70" width="250" height="115" rx="5" fill="#081020" stroke="#1a2744" />
    <rect x="25" y="80" width="75" height="95" rx="4" fill="#111d35" />
    <text x="62" y="132" fill="#60a5fa" font-size="9" text-anchor="middle" class="mono-text">Image</text>
    <text x="115" y="98" fill="#ffffff" font-size="11" font-weight="600" class="sans-text">Organic Wheat</text>
    <text x="115" y="115" fill="#8b949e" font-size="9" class="mono-text">Region: Nile Delta</text>
    <text x="115" y="132" fill="#10b981" font-size="11" font-weight="700" class="mono-text">$450 / ton</text>
    <rect x="115" y="145" width="80" height="20" rx="3" fill="#2563eb" />
    <text x="155" y="159" fill="#ffffff" font-size="8.5" font-weight="600" text-anchor="middle" class="sans-text">Order Now →</text>
  </g>

  <!-- Center: CSS Logical Properties Core Engine -->
  <g transform="translate(345, 65)">
    <rect width="190" height="180" rx="8" fill="#081020" stroke="#059669" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="8" fill="url(#coreGrad)" />
    <text x="95" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" class="mono-text">LOGICAL ENGINE</text>

    <!-- Code Snippets of Logical Properties -->
    <g transform="translate(10, 38)">
      <text x="0" y="14" fill="#6ee7b7" font-size="8.5" class="mono-text">margin-inline-start</text>
      <text x="0" y="30" fill="#6ee7b7" font-size="8.5" class="mono-text">padding-inline-end</text>
      <text x="0" y="46" fill="#6ee7b7" font-size="8.5" class="mono-text">inset-inline-start</text>
      <text x="0" y="62" fill="#6ee7b7" font-size="8.5" class="mono-text">border-start-start-radius</text>
      <line x1="0" y1="74" x2="170" y2="74" stroke="#1a2744" stroke-width="1" />
      <text x="0" y="90" fill="#93c5fd" font-size="8.5" class="mono-text">Pinia: useLocaleStore</text>
      <text x="0" y="106" fill="#8b949e" font-size="8" class="mono-text">Layout Shift: 0.00 CLS</text>
      <text x="0" y="122" fill="#f59e0b" font-size="8" class="mono-text">Mirror Latency: 0ms</text>
    </g>

    <!-- Bidirectional Mirroring Arrows -->
    <path d="M -25 90 L -5 90" fill="none" stroke="#10b981" stroke-width="2" class="mirror-line" />
    <polygon points="-25,86 -33,90 -25,94" fill="#10b981" />
    <path d="M 195 90 L 215 90" fill="none" stroke="#10b981" stroke-width="2" class="mirror-line" />
    <polygon points="215,86 223,90 215,94" fill="#10b981" />
  </g>

  <!-- Right: RTL Viewport (Arabic) -->
  <g transform="translate(570, 55)">
    <rect width="280" height="200" rx="6" fill="url(#vpGrad)" stroke="#1a2744" stroke-width="1" />
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#142038" />
    <text x="235" y="16" fill="#e6edf3" font-size="9" text-anchor="end" class="mono-text">dir="rtl" [ العرض العربي ]</text>
    <circle cx="268" cy="13" r="3" fill="#10b981" />
    <circle cx="258" cy="13" r="3" fill="#f59e0b" />
    <circle cx="248" cy="13" r="3" fill="#ef4444" />

    <!-- Simulated UI Layout (Right-to-Left Mirrored) -->
    <rect x="205" y="40" width="60" height="15" rx="3" fill="#2563eb" />
    <text x="235" y="51" fill="#ffffff" font-size="8" font-weight="600" text-anchor="middle" class="arabic-text">الكتالوج</text>
    <rect x="155" y="40" width="40" height="15" rx="3" fill="#1e293b" />
    <rect x="105" y="40" width="40" height="15" rx="3" fill="#1e293b" />
    <rect x="15" y="40" width="30" height="15" rx="3" fill="#10b981" />

    <!-- Product Card (RTL Mirrored) -->
    <rect x="15" y="70" width="250" height="115" rx="5" fill="#081020" stroke="#1a2744" />
    <rect x="180" y="80" width="75" height="95" rx="4" fill="#111d35" />
    <text x="217" y="132" fill="#60a5fa" font-size="9" text-anchor="middle" class="arabic-text">صورة</text>
    <text x="165" y="98" fill="#ffffff" font-size="11" font-weight="700" text-anchor="end" class="arabic-text">قمح عضوي ممتاز</text>
    <text x="165" y="115" fill="#8b949e" font-size="9" text-anchor="end" class="arabic-text">المنطقة: دلتا النيل</text>
    <text x="165" y="132" fill="#10b981" font-size="11" font-weight="700" text-anchor="end" class="mono-text">450 $ / طن</text>
    <rect x="85" y="145" width="80" height="20" rx="3" fill="#2563eb" />
    <text x="125" y="159" fill="#ffffff" font-size="8.5" font-weight="600" text-anchor="middle" class="arabic-text">← اطلب الآن</text>
  </g>
</svg>
