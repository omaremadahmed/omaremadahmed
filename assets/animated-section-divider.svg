<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 32" width="100%" height="32">
  <defs>
    <linearGradient id="divLineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142038" stop-opacity="0" />
      <stop offset="60%" stop-color="#1a2744" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="divLineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#1a2744" />
      <stop offset="100%" stop-color="#142038" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glowCenter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseMovementLeft {
        0% { transform: translateX(-250px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(380px); opacity: 0; }
      }
      @keyframes pulseMovementRight {
        0% { transform: translateX(250px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(-380px); opacity: 0; }
      }
      @keyframes knightGlow {
        0%, 100% { fill: #3b82f6; filter: drop-shadow(0 0 2px #3b82f6); }
        50% { fill: #60a5fa; filter: drop-shadow(0 0 6px #60a5fa); }
      }
      .pulse-left {
        animation: pulseMovementLeft 3.5s ease-in-out infinite;
      }
      .pulse-right {
        animation: pulseMovementRight 3.5s ease-in-out infinite;
      }
      .knight-icon {
        animation: knightGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Left Main Line -->
  <line x1="40" y1="16" x2="375" y2="16" stroke="url(#divLineGradLeft)" stroke-width="1.5" />
  <circle cx="375" cy="16" r="2" fill="#3b82f6" />

  <!-- Left Animated Pulse Particle -->
  <rect x="0" y="14" width="60" height="4" fill="url(#pulseGlow)" class="pulse-left" />

  <!-- Right Main Line -->
  <circle cx="425" cy="16" r="2" fill="#3b82f6" />
  <line x1="425" y1="16" x2="760" y2="16" stroke="url(#divLineGradRight)" stroke-width="1.5" />

  <!-- Right Animated Pulse Particle -->
  <rect x="740" y="14" width="60" height="4" fill="url(#pulseGlow)" class="pulse-right" />

  <!-- Center Emblem (Diamond + Chess Knight) -->
  <g transform="translate(400, 16)">
    <!-- Outer Rotated Diamond -->
    <rect x="-11" y="-11" width="22" height="22" transform="rotate(45)" fill="#060b18" stroke="#1a2744" stroke-width="1.5" />
    <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#0c1425" stroke="#3b82f6" stroke-width="1" filter="url(#glowCenter)" />
    
    <!-- Stylized Geometric Chess Knight Icon -->
    <path class="knight-icon" d="M -3 -6 C -3 -8 0 -9 2 -9 C 5 -9 6 -7 6 -5 C 6 -3 4 -2 3 -1 C 4 1 5 3 5 5 L -4 5 C -4 3 -2 2 -2 -1 C -4 -2 -5 -4 -3 -6 Z" />
  </g>
</svg>
